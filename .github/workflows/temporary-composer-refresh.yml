name: Temporary Composer lock refresh

on:
  push:
    branches:
      - security/enforce-dependency-audits

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
      - name: Update packages with security advisories
        run: |
          composer update laravel/framework livewire/livewire symfony/html-sanitizer symfony/http-foundation symfony/http-kernel symfony/mime symfony/routing --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- composer.lock; then
            echo "Composer lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore: refresh Composer lockfile [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
